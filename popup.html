<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Notes</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Car Notes</h1>
        </header>

        <div class="content">
            <p class="info-text">Click ✏️ on any car listing to add or edit a note.</p>
            <div class="features-list">
                <div class="feature-item">✏️ Add notes directly on listings</div>
                <div class="feature-item">🎨 Choose a background color</div>
                <div class="feature-item">💾 Notes are saved automatically</div>
                <div class="feature-item">🗑️ Delete notes anytime</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
